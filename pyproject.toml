[project]
name = "legal-contract-ai"
version = "0.1.0"
description = "Fine-tune and run legal contract clause analysis models"
requires-python = ">=3.10"

dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "transformers>=4.46.0",
    "datasets>=2.18.0",
    "tokenizers>=0.19.0",
    "accelerate>=0.29.0",
    "evaluate>=0.4.1",
    "scikit-learn>=1.4.0",
    "peft>=0.10.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "scipy>=1.12.0",
    "gradio>=4.28.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "jupyter>=1.0.0",
    "ipywidgets>=8.1.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.10.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.20.0",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
]

[project.scripts]
legal-ui = "ui.app:main"

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

# Tell uv to pull torch from the CUDA index, not PyPI
[tool.uv.sources]
torch     = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio  = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url  = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "ui"]

# Document parsing (added for file upload feature)
# These are listed separately since they are only needed for the UI
